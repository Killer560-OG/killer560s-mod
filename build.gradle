plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.terraformersmc.com/releases" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// SOCKS proxy support (Proxy Client feature). Minecraft bundles netty core/handler/codec,
	// but NOT netty-handler-proxy or netty-codec-socks. Bundled into the jar (Jar-in-Jar) so
	// they are present at runtime. Version must match Minecraft 26.1.2's netty version.
	include(implementation("io.netty:netty-handler-proxy:${project.netty_version}"))
	include(implementation("io.netty:netty-codec-socks:${project.netty_version}"))

	// MP3 decoding for the GIF Player's companion audio (auto-converts .mp3 to .wav so the rest of
	// the feature can keep using plain javax.sound.sampled Clips). The JDK has zero built-in MP3
	// support, so this registers real javax.sound.sampled SPI providers (AudioFileReader +
	// FormatConversionProvider) for MP3 - a maintained re-upload of javazoom's original mp3spi/
	// jlayer/tritonus-share (whose own Maven repo has been dead for years). Bundled Jar-in-Jar like
	// the netty libs above so the SPI service files are present at runtime.
	include(implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4"))
	include(implementation("com.googlecode.soundlibs:jlayer:1.0.1.4"))
	include(implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4"))

	// Offline speech-to-text for the Voice To Text feature - killer560's "hears what I say via a
	// keybind... and sends it to chat" request, with the explicit requirement that it work with zero
	// setup for him and his friends (no API key, no paid service). Vosk is a real, actively maintained
	// offline speech recognizer with prebuilt native libraries for Windows/Mac/Linux bundled directly
	// in its own jar (confirmed by inspecting the real jar from Maven Central before adding this -
	// win32-x86-64/libvosk.dll etc.) - no separate native install step. It depends on JNA for the
	// actual native calls. Both bundled Jar-in-Jar like the libraries above. The acoustic MODEL itself
	// (tens of MB) is deliberately NOT bundled here - VoiceToTextFeature downloads a small one to the
	// config folder on first real use instead, keeping this mod's own distributed jar size sane.
	include(implementation("com.alphacephei:vosk:0.3.45"))
	include(implementation("net.java.dev.jna:jna:5.14.0"))
}

processResources {
	def ver = project.version
	inputs.property "version", ver
	filesMatching("fabric.mod.json") {
		expand "version": ver
	}
}

// Two shipped variants from one codebase, per killer560's "cheat variant with everything and the
// legit variant with only legit stuff" (2026-09-08): a generated BuildVariant.CHEAT_FEATURES_ENABLED
// constant, gated at the single source of truth (ExperimentsConfig.isAutonomousMode()'s getter, not
// scattered call sites) so the legit jar can never run Autonomous auto-clicking even if someone
// hand-edits their config.json to set it true - the getter itself refuses to report true unless this
// build was compiled with -PcheatBuild=true.
def cheatBuild = (findProperty('cheatBuild') ?: 'false').toBoolean()
// Dev-only tooling (e.g. AP3's align timer) is compiled in by default - killer560's local builds and the CI dev
// build keep it - and compiled OUT of official releases, which are built with -Prelease=true. A release jar can
// never show dev tooling, whatever the config file says: the constant is false at compile time.
def releaseBuild = (findProperty('release') ?: 'false').toBoolean()
def devTools = !releaseBuild
def buildVariantDir = layout.buildDirectory.dir("generated/sources/buildVariant/java/main")

tasks.register("generateBuildVariant") {
	def outputDir = buildVariantDir
	inputs.property "cheatBuild", cheatBuild
	inputs.property "devTools", devTools
	outputs.dir(outputDir)
	doLast {
		def pkgDir = new File(outputDir.get().asFile, "com/killer560/hub")
		pkgDir.mkdirs()
		new File(pkgDir, "BuildVariant.java").text = """package com.killer560.hub;

/** Generated at build time (see build.gradle's generateBuildVariant task) - do not edit by hand. */
public final class BuildVariant {
    public static final boolean CHEAT_FEATURES_ENABLED = ${cheatBuild};
    /** Dev-only tooling (timers, probes). True for local / CI dev builds, false when built with -Prelease=true. */
    public static final boolean DEV_TOOLS = ${devTools};
    private BuildVariant() {}
}
"""
	}
}
compileJava.dependsOn "generateBuildVariant"
sourceSets.main.java.srcDir buildVariantDir

// ---------------------------------------------------------------- per-Minecraft-version compatibility layer
//
// killer560 (2026-09-30): "At some point far in the future hypixel will drop support for 26.1.2 so we will
// have to start working on higher versions ... you can create whatever structure you need."
//
// 26.2 is a refactor rather than a version bump - measured on the 26.2-port branch: 706 compile errors across
// 229 files from 84 distinct symbols, with Minecraft.screen and setScreen gone outright (396 of them), every
// EntityType constant moved to EntityTypes, the 16 coloured block variants collapsed into
// ColorCollection<Block>, and MultiBufferSource deleted from the render pipeline.
//
// Rather than fork the source, everything version-specific lives behind a small facade whose implementation
// comes from ONE directory chosen by minecraft_version. src/main stays version-neutral and is edited once;
// porting to a new Minecraft means writing a new src/mcXX_Y, not sweeping 229 files again. No interface and no
// indirection at runtime - each version's copy is a plain class with the same public statics, exactly how the
// generated BuildVariant above is consumed.
// Robust against both "26.1.2" and "26.2": a fixed [0..1] slice throws IndexOutOfBounds on a
// two-component version, which is how a -Pminecraft_version=26.2 override first failed with the
// wonderfully opaque "toIndex = 2" during configuration.
def mcParts = project.minecraft_version.toString().tokenize('.')
def mcBranch = "mc" + (mcParts.size() >= 2 ? "${mcParts[0]}_${mcParts[1]}" : mcParts[0])
def compatDir = file("src/${mcBranch}/java")
// Printed, because picking the WRONG layer would compile and then misbehave at runtime, which is far worse
// than not compiling at all.
logger.lifecycle("Minecraft ${project.minecraft_version}: compatibility layer ${mcBranch}")
if (!compatDir.directory) {
	throw new GradleException("No compatibility layer for Minecraft ${project.minecraft_version}: expected "
			+ "${compatDir}. Porting to a new Minecraft version starts by creating that directory - copy the "
			+ "nearest existing src/mc*/java and fix what moved.")
}
sourceSets.main.java.srcDir compatDir

jar {
	// The Minecraft version is in the name of all four jars on purpose. With a legit and a cheat jar for each
	// of two Minecraft versions, two files both called "-legit.jar" is how somebody installs the wrong one -
	// and .github/workflows/dev-build.yml collects them with a `*-legit.jar` glob, which would silently pick
	// whichever landed last.
	archiveClassifier = "${project.minecraft_version}-" + (cheatBuild ? "cheat" : "legit")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Raised from javac's default of 100. While porting to a new Minecraft version the count IS the plan, and
	// "100 errors" tells you only that the cap was hit - it reported 100 when the true figure was 706.
	it.options.compilerArgs += ['-Xmaxerrs', '10000']
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

