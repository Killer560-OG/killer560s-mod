# Builds the legit and cheat jars for 26.1.2 and 26.2 on every push to main and publishes them on one rolling "Latest Dev Build" pre-release,
# replaced each time, so the newest commit is always one click away without building from source.
# Real versioned releases (v1.0.0, v1.1.0, ...) are never touched.
name: Dev Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Four jars: legit and cheat for Minecraft 26.1.2 and 26.2. The build tree is cleared between them (as the
      # local four-jar build does) so the generated BuildVariant and compiled classes never carry over.
      - name: Build jars (26.1.2 and 26.2, legit and cheat)
        run: |
          mkdir dist
          V262="-Pminecraft_version=26.2 -Pfabric_api_version=0.160.0+26.2 -Pmodmenu_version=20.0.2"
          for args in "" "-PcheatBuild=true" "$V262" "-PcheatBuild=true $V262"; do
            rm -rf build/generated/sources/buildVariant build/classes build/libs
            ./gradlew build $args --no-daemon
            cp build/libs/*-legit.jar build/libs/*-cheat.jar dist/ 2>/dev/null || true
          done
          ls -la dist
          test "$(ls dist/*.jar | wc -l)" -eq 4

      - name: Publish Latest Dev Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          gh release delete dev-latest --yes --cleanup-tag || true
          cat > notes.md <<EOF
          **Automatic build of the newest commit** - not an official release, and most of it is still being tested.

          Commit: \`${SHORT}\` - ${SUBJECT}

          Pick the jar matching your Minecraft version (\`26.1.2\` or \`26.2\` in the file name):

          - \`*-legit.jar\` - what almost everyone wants.
          - \`*-cheat.jar\` - adds the automation features. Against Hypixel's rules; your risk.

          Install steps are in the Discord's how-to-install channel. Stable versions are the numbered releases.
          EOF
          gh release create dev-latest dist/*.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest Dev Build (${SHORT})" \
            --notes-file notes.md
