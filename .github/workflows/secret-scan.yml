# Secret scan (security audit 2026-10-27): gitleaks over the pushed commits with the repo's .gitleaks.toml (the
# default rules plus Hypixel, Discord, Cloudflare, Microsoft/Minecraft, Spotify and connection-string rules). Any hit
# fails the run. The binary is pinned by version and SHA-256 rather than taken from a marketplace action, so no
# third-party code runs with this repo's token, and the report is redacted so a hit is never printed in the log.
name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o sums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' sums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz sums.txt

      # Push: only the commits this push added (the full history was scanned by hand on 2026-10-27). PR and manual
      # runs: the whole history.
      - name: Scan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$GITHUB_SHA"
          else
            RANGE="--all"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$RANGE" .
