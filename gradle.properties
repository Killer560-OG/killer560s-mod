org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties - check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.1.0
maven_group=com.killer560.hub
archives_base_name=killer560smod

# Dependencies
fabric_api_version=0.155.2+26.1.2
modmenu_version=18.0.0

# The netty SOCKS stack for the Proxy Client is bundled Jar-in-Jar, and its version has to match whatever netty
# Minecraft ships - which is NOT the same for 26.1.2 (4.2.7.Final) and 26.2 (4.2.15.Final). It therefore lives in
# build.gradle keyed by Minecraft version, verified against the real classpath by the nettyMatchesMinecraft task,
# rather than as one property here that only ever matched one of the two.
